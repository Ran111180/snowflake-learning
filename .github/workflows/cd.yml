name: CD - Deploy to PROD on Merge
on:
  push:
    branches: [main, master]
    paths:
      - 'migrations/**'
      - 'stored_procedures/**'
      - 'tasks/**'

jobs:
  deploy-to-prod:
    runs-on: ubuntu-latest
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_WAREHOUSE: COMPUTE_WH
      SNOWFLAKE_DATABASE: LEARNING_DB
      SNOWFLAKE_ROLE: ACCOUNTADMIN

    steps:
      - uses: actions/checkout@v4

      - name: Install SnowSQL
        run: |
          curl -O https://sfc-repo.snowflakecomputing.com/snowsql/bootstrap/1.3/linux_x86_64/snowsql-1.3.1-linux_x86_64.bash
          SNOWSQL_DEST=~/bin SNOWSQL_LOGIN_SHELL=~/.profile bash snowsql-1.3.1-linux_x86_64.bash

      - name: Deploy Migrations to PROD
        run: |
          for f in migrations/*.sql; do
            echo "Deploying $f to PROD..."
            ~/bin/snowsql -a $SNOWFLAKE_ACCOUNT -u $SNOWFLAKE_USER \
              -d LEARNING_DB -s HEALTH_DATA -w COMPUTE_WH \
              -f "$f" --option exit_on_error=true
          done

      - name: Post-Deploy Validation
        run: |
          echo "Running post-deploy tests against PROD..."
          for f in tests/*.sql; do
            RESULT=$(~/bin/snowsql -a $SNOWFLAKE_ACCOUNT -u $SNOWFLAKE_USER \
              -d LEARNING_DB -s HEALTH_DATA -w COMPUTE_WH \
              -f "$f" -o output_format=csv -o header=false)
            if echo "$RESULT" | grep -q "FAIL"; then
              echo "POST-DEPLOY TEST FAILED: $f"
              echo "Initiating rollback..."
              exit 1
            fi
          done
          echo "All post-deploy tests passed! Deployment successful."

      - name: Notify Success
        if: success()
        run: echo "Deployment to LEARNING_DB (PROD) completed successfully."

      - name: Notify Failure
        if: failure()
        run: echo "DEPLOYMENT FAILED. Manual rollback may be required."
